<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Chess Lite</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>


<div id="authScreen" class="screen">
  <div class="lobby-card">
    <h1>Chess Lite</h1>

    <form id="loginForm" class="auth-form">
      <input type="text" name="username" placeholder="Username" required minlength="3" maxlength="20" />
      <input type="password" name="password" placeholder="Password" required minlength="6" />
      <button type="submit">Log in</button>
    </form>

    <form id="registerForm" class="auth-form hidden">
      <input type="text" name="username" placeholder="Username" required minlength="3" maxlength="20" />
      <input type="password" name="password" placeholder="Password (min 6 characters)" required minlength="6" />
      <label class="photo-field">
        <span>Profile photo (optional)</span>
        <input type="file" name="photo" accept="image/*" />
      </label>
      <button type="submit">Create account</button>
    </form>

    <p class="toggle-auth">
      <span id="showRegister">Need an account? Sign up</span>
      <span id="showLogin" class="hidden">Already have an account? Log in</span>
    </p>

    <p id="authError" class="error hidden"></p>
  </div>
</div>


<div id="lobby" class="screen hidden">
  <div class="lobby-card">
    <div class="account-bar">
      <div class="player-info">
        <span id="lobbyAvatar" class="avatar"></span>
        <span id="lobbyUsername"></span>
      </div>
      <button id="logoutBtn" class="link-btn">Log out</button>
    </div>

    <div class="section">
      <h2>Quick Match</h2>
      <div class="time-buttons">
        <button class="time-btn" data-tc="blitz">3 min</button>
        <button class="time-btn" data-tc="rapid">10 min</button>
      </div>
    </div>

    <div class="section">
      <h2>Play a Friend</h2>
      <div class="time-buttons">
        <button class="create-btn" data-tc="blitz">Create 3 min room</button>
        <button class="create-btn" data-tc="rapid">Create 10 min room</button>
      </div>
      <div id="roomLinkBox" class="room-link-box hidden">
        <span>Share this code:</span>
        <div class="room-code-row">
          <code id="roomCodeDisplay"></code>
          <button id="copyLinkBtn" class="link-btn">Copy link</button>
        </div>
      </div>
      <div class="join-row">
        <input id="joinCodeInput" type="text" maxlength="6" placeholder="Enter room code" />
        <button id="joinBtn">Join</button>
      </div>
    </div>

    <div id="queueStatus" class="queue-status hidden">
      <span id="queueText">Waiting for opponent…</span>
    </div>

    <p id="lobbyError" class="error hidden"></p>
  </div>
</div>


<div id="game" class="screen hidden">
  <div class="game-wrap">
    <div class="player-bar">
      <span class="player-info">
        <span id="opponentAvatar" class="avatar"></span>
        <span id="opponentName">Waiting…</span>
      </span>
      <span class="clock" id="opponentClock">--:--</span>
    </div>

    <div id="board" class="board"></div>

    <div class="player-bar">
      <span class="player-info">
        <span id="selfAvatar" class="avatar"></span>
        <span id="selfName"></span>
      </span>
      <span class="clock" id="selfClock">--:--</span>
    </div>

    <div class="controls">
      <button id="resignBtn" class="ctrl-btn">Resign</button>
      <button id="drawBtn" class="ctrl-btn">Offer draw</button>
      <button id="leaveBtn" class="ctrl-btn hidden">Back to lobby</button>
    </div>
  </div>

  <div id="promotionModal" class="modal hidden">
    <div class="modal-card">
      <p>Promote pawn to:</p>
      <div class="promo-choices">
        <button data-piece="q">Q</button>
        <button data-piece="r">R</button>
        <button data-piece="b">B</button>
        <button data-piece="n">N</button>
      </div>
    </div>
  </div>

  <div id="drawModal" class="modal hidden">
    <div class="modal-card">
      <p id="drawText">Opponent offers a draw.</p>
      <div class="promo-choices">
        <button id="drawAcceptBtn" class="ctrl-btn">Accept</button>
        <button id="drawDeclineBtn" class="ctrl-btn">Decline</button>
      </div>
    </div>
  </div>

  <div id="gameOverModal" class="modal hidden">
    <div class="modal-card">
      <h2 id="gameOverTitle">Game Over</h2>
      <p id="gameOverReason"></p>
      <button id="gameOverCloseBtn" class="ctrl-btn">Back to lobby</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/client.js"></script>
</body>
</html>
